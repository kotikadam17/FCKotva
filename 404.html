<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ofsajd! Stránka nenalezena | FC Kotva</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0A0A">
  <!-- absolutní cesty: 404 se zobrazuje na libovolné adrese pod /FCKotva/ -->
  <link rel="icon" type="image/png" href="/FCKotva/assets/icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/FCKotva/css/style.css?v=dev">
  <style>
    .nf { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 32px 16px; position: relative; overflow: hidden; }
    .nf__inner { position: relative; display: flex; flex-direction: column; align-items: center; gap: 16px; max-width: 34rem; }
    .nf__code { font-size: clamp(6rem, 34vw, 12rem); margin: 0; color: var(--gold); text-shadow: 0 0 60px rgba(242, 193, 46, .35); }
    .nf__title { font-size: clamp(2rem, 9vw, 3.4rem); margin: 0; }
    .nf p { color: #DADADA; margin: 0; }
    .nf__flag { font-size: 3rem; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="hero__glow" aria-hidden="true"></div>
    <div class="nf__inner">
      <span class="nf__flag" aria-hidden="true">🚩</span>
      <p class="display nf__code">404</p>
      <h1 class="display nf__title">Ofsajd!</h1>
      <p>Tahle stránka stála za poslední obranou. Pomezní zvedl praporek a sudí to odpískal. Žádný VAR nebude.</p>
      <a class="btn btn--gold" href="/FCKotva/">Zpátky na hřiště ⚓</a>
    </div>
  </main>
</body>
</html>
